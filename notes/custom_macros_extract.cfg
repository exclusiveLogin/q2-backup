# ===== from printer.cfg: E_UNLOAD override =====
[gcode_macro E_UNLOAD]
rename_existing: BASE_E_UNLOAD
gcode:
    {% set req_n = params.SLOT|default(-1)|int %}
    {% set sync = printer.save_variables.variables.slot_sync|default("slot-1") %}
    {% set box_slot = sync if sync[:4] == "slot" and sync != "slot-1" and sync != "slot16" else "" %}
    {% if req_n >= 0 and req_n <= 15 %}
        EXTRUDER_UNLOAD SLOT=slot{req_n}
    {% elif box_slot != "" %}
        EXTRUDER_UNLOAD SLOT={box_slot}
    {% else %}
        CUT_FILAMENT_1
        MOVE_TO_TRASH
        G92 E0
        G1 E-60 F300
    {% endif %}



# ===== MOVE_TO_TRASH =====
[gcode_macro MOVE_TO_TRASH]
gcode:
#    _CG28
    
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    M204 S5000
    {% if (printer.gcode_move.position.y) > 270 %}
        {% if (printer.gcode_move.position.x) > 112 or (printer.gcode_move.position.x) < 85 %}
            G1 Y270 F8000
            G1 X85 F8000
            G1 Y270 F8000
            G1 Y287.5 F500
        {% endif %}
        G1 X85 F8000
        G1 Y287.5 F500
    {% else %}
        G1 X85 F8000
        G1 Y260 F8000
        G1 Y287.5 F500
    {% endif %}

# ===== PRINT_END =====
[gcode_macro PRINT_END]
gcode:
    M400
    save_zoffset
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    M106 P2 S0
    M106 P0 S0
    M106 P4 S0                                                     # е…ій—­з©єи°ѓ
    # M106 P3 S0
    DISABLE_BOX_HEATER
    
    M104 S0
    M140 S0
    M141 S0

    M220 S100
    M221 S100
    M84
	
    DISABLE_ALL_SENSOR
    {% if printer.save_variables.variables.box_count >= 1 and printer.save_variables.variables.enable_box == 1 and printer["box_extras"]%}
        BUFFER_MONITORING ENABLE=0
    {% endif %}
#    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    G31
    CLEAR_LAST_FILE
    BEEP I=2 DUR=500
    # SDCARD_RESET_FILE
    SET_PRINT_MAIN_STATUS MAIN_STATUS=ready     

# ===== CANCEL_PRINT =====
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        M204 S10000   
        G90
        {% if (printer.gcode_move.position.z) < 100 %}
        G1 Z100 F600                                       
        {% endif %}
        {% if (printer.gcode_move.position.y) > printer['gcode_macro PRINTER_PARAM'].max_y_position %}
            G1 Y{printer['gcode_macro PRINTER_PARAM'].max_y_position - 50} F6000                                       
        {% endif %}
        G1  X265 Y5 F7800
    {% endif %}
    {% if printer.save_variables.variables.box_count >= 1 and printer.save_variables.variables.enable_box == 1 and printer["box_extras"]%}
        BUFFER_MONITORING ENABLE=0
    {% endif %}
    M400
    save_zoffset
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

    M106 P2 S0
    M106 P0 S0
    M106 P3 S0
    M106 P4 S0                                                     # е…ій—­з©єи°ѓ
    
    M104 S0
    M140 S0
    M141 S0
    DISABLE_BOX_HEATER

    M220 S100
    M221 S100
    M84
	
    DISABLE_ALL_SENSOR
    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    G31
    BEEP I=2 DUR=500

    BASE_CANCEL_PRINT
    CLEAR_LAST_FILE
    SET_PRINT_MAIN_STATUS MAIN_STATUS=ready
    M118 Canceled print!

# ===== PAUSE =====
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set wipe = params.W|default(0)|int %}
    {% set z = params.Z|default(5)|int %}
    
    {% if printer['pause_resume'].is_paused|int == 0 %}     
        SET_GCODE_VARIABLE MACRO=RESUME_PRINT VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME_PRINT VARIABLE=etemp VALUE={printer['extruder'].target}
        SET_GCODE_VARIABLE MACRO=RESUME_PRINT VARIABLE=efan VALUE={printer["fan_generic cooling_fan"].speed *255}
        SET_GCODE_VARIABLE MACRO=RESUME_PRINT VARIABLE=echambertemp VALUE={printer['heater_generic chamber'].target}

        DISABLE_ALL_SENSOR
        {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] and printer.save_variables.variables.enable_box == 1 %}
            BUFFER_MONITORING ENABLE=0 
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSE              
        BASE_PAUSE
        SET_IDLE_TIMEOUT TIMEOUT=43200  # 12 С‡Р°СЃРѕРІ РЅР° РїР°СѓР·Рµ
        {% if printer.extruder.can_extrude %}
            G92 E0
            G1 E-5 F1800
        {% endif %}
        {% if "z" in printer.toolhead.homed_axes and (printer.gcode_move.position.z + z ) < printer['gcode_macro PRINTER_PARAM'].max_z_position %}
            G91
            G1 Z{z} F900
        {% else %}
            SET_GCODE_VARIABLE MACRO=RESUME_PRINT VARIABLE=zhop VALUE=0
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSEPARK
        {% if "xy"  in printer.toolhead.homed_axes %}
            G90
            G1 X{printer['gcode_macro PRINTER_PARAM'].clear_x_position} F4000
            G1 Y{printer['gcode_macro PRINTER_PARAM'].clear_y_position} F4000
        {% endif %}
        {% if wipe != 0 %}
            MOVE_TO_TRASH
            M204 S5000
            G1 X115 F4000
            G1 X98 F8000
            G1 X115 F4000
            G1 X98 F8000
            G1 X115 F4000
            G1 X98 F8000
            G1 X115 F4000
            G1 X98 F8000
            G1 X115 F4000
            G1 X98 F8000
            G1 X140 F8000
            MOVE_TO_TRASH
        {% endif %} 
        M104 S0
        SET_IDLE_TIMEOUT TIMEOUT=259200   #72H
        SET_STEPPER_ENABLE STEPPER=extruder enable=0
        {% set slot_sync = printer.save_variables.variables.slot_sync|default("slot-1") %}
        {% if printer['box_stepper ' ~ slot_sync] %}
            SET_STEPPER_ENABLE STEPPER='box_stepper '{slot_sync} enable=0
        {% endif %}
    {% endif %}

# ===== CUT_FILAMENT_1 =====
[gcode_macro CUT_FILAMENT_1]
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    M204 S10000
    {% if (printer.gcode_move.position.x) < 15 %}
        G1 X15 F9000
        G1 Y0.5 F9000
    {% endif %}
    G1 Y0.5 F15000
    G1 X15 F15000
    G1 X-0.5 F5000
    G4 P1000
    G1 X1 F1000
    G1 X-0.5 F5000
    G4 P1000
    G1 X1 F1000
    G4 P1000
    G1 X15 F3000

